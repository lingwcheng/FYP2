<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - EduSphere</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="login-card">
        <div class="logo">🛡️ EduSphere</div>
        <p style="color: #64748b; margin-bottom: 30px;">Sign in to your account</p>
        
        <form id="login-form">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="login-email" placeholder="Enter your email" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="login-pwd" placeholder="Enter your password" required>
            </div>
            <button type="submit" id="btn-submit" class="btn-login">Login ➔</button>
        </form>

        <div class="demo-hint">
            <b>FYP Demo Accounts:</b><br><br>
            Teacher: teacher@edu.com<br>
            Student: student@edu.com<br>
            Password for both: 123456<br><br>
            <button type="button" id="setup-demo-btn" style="padding: 6px 12px; cursor: pointer; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; font-size: 12px;">
                ⚙️ 首次使用：一键在 Firebase 创建测试账号
            </button>
        </div>
    </div>

    <!-- 使用 type="module" 接入 Firebase -->
    <script type="module" src="../js/login.js"></script>
</body>
</html>
