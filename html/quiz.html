<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - EduSphere</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #e4edff 0%, #f1eaff 50%, #e0f7f2 100%); height: 100vh; display: flex; overflow: hidden; }
        .sidebar { width: 280px; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px); border-right: 1px solid rgba(255, 255, 255, 0.6); padding: 30px; display: flex; flex-direction: column; gap: 30px; }
        .profile-box { text-align: center; background: rgba(255,255,255,0.5); padding: 20px; border-radius: 20px; }
        .profile-box img { width: 80px; border-radius: 50%; margin-bottom: 10px; border: 3px solid #fff; }
        .quiz-info { background: #fff; padding: 15px; border-radius: 15px; border-left: 5px solid #4318FF; }
        .stats-box { flex-grow: 1; display: flex; flex-direction: column; gap: 15px; font-size: 0.9rem; }
        .stat-item { display: flex; justify-content: space-between; padding-bottom: 5px; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .main-quiz { flex-grow: 1; padding: 40px; position: relative; display: flex; flex-direction: column; gap: 25px; }
        .quiz-status-bar { display: flex; gap: 20px; align-items: center; }
        .progress-container { flex-grow: 1; background: rgba(255,255,255,0.6); padding: 20px; border-radius: 20px; display: flex; align-items: center; gap: 15px; }
        .progress-bar-bg { flex-grow: 1; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: #4318FF; border-radius: 4px; transition: width 0.3s; }
        .timer-box { background: white; padding: 15px 25px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 10px; font-weight: 700; color: #4318FF; }
        .warning-popup { position: absolute; top: 40px; right: 40px; width: 320px; background: rgba(255, 95, 95, 0.9); backdrop-filter: blur(10px); color: white; padding: 20px; border-radius: 20px; display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 30px rgba(255, 95, 95, 0.3); z-index: 100; display: none; }
        .question-card { background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.8); border-radius: 30px; padding: 50px; flex-grow: 1; display: flex; flex-direction: column; gap: 30px; }
        .question-text { font-size: 1.8rem; font-weight: 700; color: #1e1b4b; }
        .options-grid { display: flex; flex-direction: column; gap: 15px; }
        .option { background: rgba(255,255,255,0.7); padding: 20px 30px; border-radius: 20px; border: 2px solid transparent; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 20px; font-size: 1.1rem; font-weight: 600; }
        .option:hover { background: white; transform: translateX(5px); border-color: #4318FF; }
        .option.selected { background: #f0fdf4; border-color: #22c55e; color: #166534; }
        .option-label { width: 40px; height: 40px; background: #e2e8f0; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #4318FF; }
        .selected .option-label { background: #22c55e; color: white; }
        .nav-btns { display: flex; justify-content: space-between; margin-top: auto; }
        .btn { padding: 15px 40px; border-radius: 15px; border: none; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-prev { background: white; color: #64748b; }
        .btn-next { background: #4318FF; color: white; box-shadow: 0 10px 20px rgba(67, 24, 255, 0.2); }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="profile-box">
            <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Aarav" alt="Avatar">
            <h3 style="font-size:1.1rem">Ali bin Ahmad</h3>
            <p style="font-size:0.8rem; color:#64748b" id="sidebar-standard">Standard 5</p>
        </div>
        <div class="quiz-info">
            <h4 style="font-size:0.9rem; color:#4318FF" id="sidebar-subject">Practice Quiz</h4>
            <p style="font-size:0.75rem; color:#64748b">Mixed KSSR Chapters</p>
        </div>
        <div class="stats-box">
            <div class="stat-item"><span>Total Questions</span> <strong id="total-q">3</strong></div>
            <div class="stat-item"><span>Attempted</span> <strong style="color:#22c55e" id="attempted-q">0</strong></div>
        </div>
        <button class="btn btn-prev" style="margin-top:auto; color:#ef4444" onclick="window.location.href='student.html'">🚪 Leave Quiz</button>
    </div>

    <div class="main-quiz">
        <div class="warning-popup" id="cheat-warning">
            <div style="font-size:2rem">⚠️</div>
            <div>
                <div style="font-weight:700">Warning:</div>
                <div style="font-size:0.85rem">Tab switching detected</div>
            </div>
            <div style="margin-left:auto; cursor:pointer" onclick="document.getElementById('cheat-warning').style.display='none'">✕</div>
        </div>

        <div class="quiz-status-bar">
            <div class="progress-container">
                <span style="font-weight:600; font-size:0.9rem">Question <span id="current-q-num">1</span> <span style="color:#64748b; font-weight:400">of 3</span></span>
                <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill" style="width: 33%;"></div></div>
                <span style="font-weight:600" id="progress-text">33%</span>
            </div>
            <div class="timer-box"><span>⏱️</span> 15:00</div>
        </div>

        <div class="question-card">
            <div style="background:#e0e7ff; color:#4318FF; padding:5px 15px; border-radius:10px; width:fit-content; font-size:0.8rem; font-weight:700" id="topic-tag">Topic</div>
            <div class="question-text" id="question-text">Loading question...</div>
            <div class="options-grid" id="options-grid"></div>
            <div class="nav-btns">
                <button class="btn btn-prev" style="visibility:hidden">← Previous</button>
                <button class="btn btn-next" id="next-btn" onclick="nextQuestion()">Next Question →</button>
            </div>
        </div>
    </div>

    <!-- 引入翻译引擎和考试逻辑 -->
    <script src="../js/settings.js"></script>
    <script src="../js/quiz.js"></script>
</body>
</html>
